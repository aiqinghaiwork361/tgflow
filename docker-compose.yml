services:
  tgflow:
    build:
      context: .
      args:
        # CN 网络：pypi 直连慢/断，BuildKit 不继承 daemon 代理
        PIP_INDEX: https://mirrors.aliyun.com/pypi/simple/
    image: tgflow:local
    container_name: tgflow
    network_mode: host
    volumes:
      - ./.env:/app/.env:ro
      - ./tgflow:/app/tgflow
      - ./plugins:/app/plugins
      - ./data:/app/data
      - ./tgflow.log:/app/tgflow.log
    environment:
      - TZ=Asia/Shanghai
      - TGFLOW_HOME=/app
      - TGFLOW_PORT=18319
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18319/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
