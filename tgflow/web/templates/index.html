<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tgflow 插件面板</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e8ec;
    --dim: #8b93a3;
    --accent: #4da3ff;
    --ok: #3fbf7f;
    --warn: #e8a33d;
    --err: #e5544b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .ver { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .spacer { flex: 1; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 16px; overflow: hidden;
  }
  .card > h2 {
    font-size: 13px; font-weight: 600; margin: 0; padding: 12px 16px;
    border-bottom: 1px solid var(--line); color: var(--dim);
    text-transform: uppercase; letter-spacing: .6px;
    display: flex; align-items: center; gap: 10px;
  }
  .card > h2 .n { color: var(--accent); font-family: var(--mono); }
  .body { padding: 14px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 21px; font-family: var(--mono); margin-top: 4px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 9px 16px; color: var(--dim); font-weight: 500;
    border-bottom: 1px solid var(--line); font-size: 11px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.off td { opacity: .45; }
  .pname { font-family: var(--mono); font-weight: 600; }
  .psrc { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .hooks { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    font-family: var(--mono); font-size: 10px; padding: 2px 6px;
    border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
  }
  .tag.on { color: var(--accent); border-color: #2c4d75; }
  .tag.ext { color: var(--warn); border-color: #5a4620; }
  .prio { font-family: var(--mono); color: var(--dim); }
  .switch {
    position: relative; width: 38px; height: 21px; border-radius: 11px;
    background: #333a47; cursor: pointer; transition: background .16s; flex: none;
  }
  .switch.on { background: var(--ok); }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
    border-radius: 50%; background: #fff; transition: transform .16s;
  }
  .switch.on::after { transform: translateX(17px); }
  button {
    font: inherit; font-size: 12px; padding: 6px 13px; border-radius: 6px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    cursor: pointer; transition: border-color .15s;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #1b4a78; border-color: #2c6ba8; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  pre {
    margin: 0; padding: 12px 16px; font-family: var(--mono); font-size: 12px;
    line-height: 1.55; max-height: 340px; overflow: auto; color: #c3c9d4;
    white-space: pre-wrap; word-break: break-all;
  }
  .empty { padding: 22px 16px; color: var(--dim); text-align: center; font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .dot.warn { background: var(--warn); }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 18px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 99; max-width: 80vw;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--err); color: #ffb4ae; }
  .toast.ok { border-color: var(--ok); color: #a5e8c6; }
  .inline { display: inline-flex; align-items: center; gap: 7px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tgflow 插件面板</h1>
    <span class="ver" id="ver">—</span>
    <span class="spacer"></span>
    <span class="inline"><span class="dot ok" id="live"></span><span id="liveTxt">连接中…</span></span>
    <button id="btnReload" class="primary">热重载插件</button>
  </header>

  <section class="card">
    <h2>运行状态</h2>
    <div class="body"><div class="grid" id="stats"></div></div>
  </section>

  <section class="card">
    <h2>插件列表 <span class="n" id="plugCount"></span></h2>
    <div id="plugTable"></div>
  </section>

  <section class="card">
    <h2>外挂插件目录 <span class="n" id="extCount"></span></h2>
    <div id="extTable"></div>
  </section>

  <section class="card">
    <h2>运行日志</h2>
    <pre id="logs">加载中…</pre>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({ok:false, error:'bad json'}));
  if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
};
const toast = (msg, kind='') => {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2400);
};

async function loadStatus() {
  try {
    const d = await api('/api/status');
    $('#live').className = 'dot ok'; $('#liveTxt').textContent = '已连接';
    $('#ver').textContent = 'v' + (d.items.find(i=>i.key==='version')?.value || '?');
    $('#stats').innerHTML = d.items.map(i =>
      `<div class="stat"><div class="k">${i.key}</div><div class="v">${i.value}</div></div>`
    ).join('');
  } catch (e) {
    $('#live').className = 'dot err'; $('#liveTxt').textContent = '连接失败';
  }
}

async function loadPlugins() {
  const d = await api('/api/plugins');
  const items = d.items;
  $('#plugCount').textContent = items.length;
  if (!items.length) { $('#plugTable').innerHTML = '<div class="empty">没有插件</div>'; return; }
  $('#plugTable').innerHTML = `
    <table><thead><tr>
      <th>插件</th><th>优先级</th><th>Hooks</th><th>依赖</th><th style="text-align:right">启用</th>
    </tr></thead><tbody>
    ${items.map(p => `
      <tr class="${p.enabled ? '' : 'off'}" data-name="${p.name}">
        <td>
          <div class="pname">${p.name}</div>
          <div class="psrc">${p.source || p.class}</div>
        </td>
        <td class="prio">${p.priority}</td>
        <td><div class="hooks">${p.hooks.map(h=>`<span class="tag on">${h}</span>`).join('')}</div></td>
        <td class="psrc">${[...p.requires, ...p.optional_requires.map(x=>'?'+x)].join(', ') || '—'}</td>
        <td style="text-align:right">
          <div class="switch ${p.enabled ? 'on' : ''}" data-toggle="${p.name}"></div>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
  $('#plugTable').querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = async () => {
      const name = el.dataset.toggle;
      const on = el.classList.contains('on');
      try {
        await api('/api/plugins/' + name, {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({enabled: !on})
        });
        toast(name + (on ? ' 已停用' : ' 已启用'), 'ok');
        await loadPlugins(); await loadStatus();
      } catch (e) { toast('操作失败: ' + e.message, 'err'); }
    };
  });
}

async function loadExternal() {
  const d = await api('/api/external');
  const items = d.items;
  $('#extCount').textContent = items.length;
  if (!items.length) {
    $('#extTable').innerHTML = '<div class="empty">目录为空 — 往这里丢 .py 插件文件，重载即生效</div>';
    return;
  }
  $('#extTable').innerHTML = `
    <table><thead><tr><th>文件</th><th>大小</th><th>状态</th></tr></thead><tbody>
    ${items.map(f => `<tr>
      <td class="pname">${f.file}</td>
      <td class="prio">${f.size} B</td>
      <td>${f.loaded ? '<span class="tag on">已加载</span>' : '<span class="tag">未加载</span>'}</td>
    </tr>`).join('')}
    </tbody></table>`;
}

async function loadLogs() {
  try {
    const d = await api('/api/logs?lines=120');
    $('#logs').textContent = d.items.map(i => i.line).join('\n') || '(空)';
  } catch (e) { $('#logs').textContent = '日志读取失败: ' + e.message; }
}

$('#btnReload').onclick = async () => {
  const b = $('#btnReload'); b.disabled = true; b.textContent = '重载中…';
  try {
    const d = await api('/api/plugins/reload', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({})
    });
    toast('已重载 ' + (d.items?.length || 0) + ' 个模块', 'ok');
    await Promise.all([loadPlugins(), loadExternal(), loadStatus(), loadLogs()]);
  } catch (e) { toast('重载失败: ' + e.message, 'err'); }
  b.disabled = false; b.textContent = '热重载插件';
};

loadStatus(); loadPlugins(); loadExternal(); loadLogs();
setInterval(loadStatus, 5000);
setInterval(loadLogs, 8000);
</script>
</body>
</html>
